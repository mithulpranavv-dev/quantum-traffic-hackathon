<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Traffic Control</title>
  <style>
    :root { --ink:#14211f; --muted:#64716d; --paper:#f4f0e7; --panel:#fffdf8; --line:#d8d5ca; --teal:#0d7770; --orange:#d96b39; --yellow:#f0b94b; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0%, #d9eee5 0 18%, transparent 42%), var(--paper); font:15px/1.45 Georgia, serif; }
    .shell { max-width:1180px; margin:0 auto; padding:38px 22px 60px; } header { display:flex; justify-content:space-between; align-items:end; gap:24px; border-bottom:1px solid var(--line); padding-bottom:25px; }
    h1 { max-width:650px; margin:0; font-size:clamp(2.2rem, 5vw, 4.8rem); line-height:.94; font-weight:500; letter-spacing:-.03em; } .kicker { color:var(--teal); font:700 12px/1.2 ui-sans-serif, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    .status { color:var(--muted); font:13px ui-sans-serif, sans-serif; text-align:right; } .status strong { color:var(--teal); display:block; font-size:15px; }
    .controls { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; align-items:end; padding:22px 0; } label { display:grid; gap:6px; color:var(--muted); font:12px ui-sans-serif, sans-serif; } input, select, button { min-height:40px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink); padding:9px 11px; font:inherit; } button { background:var(--teal); color:white; border-color:var(--teal); cursor:pointer; font-family:ui-sans-serif, sans-serif; font-weight:700; } button.secondary { background:transparent; color:var(--teal); } button:disabled { opacity:.55; cursor:wait; }
    .checks { display:flex; gap:14px; align-items:center; min-height:40px; font:13px ui-sans-serif, sans-serif; } .checks label { display:flex; align-items:center; gap:5px; color:var(--ink); } .checks input { min-height:auto; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); } .metric { background:var(--panel); padding:18px; } .metric span { display:block; color:var(--muted); font:11px ui-sans-serif,sans-serif; text-transform:uppercase; letter-spacing:.08em; } .metric b { display:block; margin-top:7px; font-size:2rem; font-weight:500; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin-top:18px; } .panel { background:rgba(255,253,248,.83); border-top:3px solid var(--ink); padding:18px; } h2 { margin:0 0 14px; font-size:1.35rem; font-weight:500; } canvas { width:100%; height:330px; display:block; background:#eef1e9; } table { width:100%; border-collapse:collapse; font:13px ui-sans-serif,sans-serif; } th,td { padding:9px 5px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); font-size:11px; text-transform:uppercase; } .error { color:#a52f26; margin-top:12px; font-family:ui-sans-serif,sans-serif; }
    @media (max-width:800px) { header { display:block; } .status { margin-top:15px; text-align:left; } .controls { grid-template-columns:repeat(2,1fr); } .grid { grid-template-columns:1fr; } .metrics { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="kicker">Urban systems / hybrid optimization</div><h1>Signals that learn the shape of the street.</h1></div><div class="status"><strong id="status">Ready</strong><span>Vercel serverless simulation</span></div></header>
    <section class="controls">
      <label>Controller<select id="controller"><option value="quantum">Quantum (QAOA)</option><option value="fixed">Fixed-time</option><option value="greedy">Greedy adaptive</option></select></label>
      <label>Intersections<input id="intersections" type="number" min="4" max="8" value="6"></label>
      <label>Steps<input id="steps" type="number" min="1" max="40" value="12"></label>
      <label>Seed<input id="seed" type="number" min="0" value="42"></label>
      <div class="checks"><label><input id="spike" type="checkbox" checked> Spike</label><label><input id="ambulance" type="checkbox" checked> Ambulance</label></div>
      <button id="run">Run simulation</button>
    </section>
    <section class="metrics"><div class="metric"><span>Average queue</span><b id="avg">--</b></div><div class="metric"><span>Throughput</span><b id="throughput">--</b></div><div class="metric"><span>Fuel</span><b id="fuel">--</b></div><div class="metric"><span>CO2</span><b id="co2">--</b></div></section>
    <section class="grid"><div class="panel"><h2>Network state</h2><canvas id="network" width="760" height="330"></canvas></div><div class="panel"><h2>Intersection load</h2><div id="table">Run a scenario to inspect the network.</div></div></section>
    <div id="error" class="error"></div>
  </main>
<script>
const $ = id => document.getElementById(id);
function options() { return { controller:$('controller').value, intersections:+$('intersections').value, steps:+$('steps').value, seed:+$('seed').value, spike:$('spike').checked, ambulance:$('ambulance').checked }; }
function draw(data) { const canvas=$('network'), ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); const nodes=Object.fromEntries(data.nodes.map(n=>[n.id,n])), scale=82, ox=110, oy=80; ctx.lineWidth=5; data.edges.forEach(e=>{ const a=nodes[e.from],b=nodes[e.to]; ctx.strokeStyle=e.status==='closed'?'#c9c4b8':'#aab7ae'; ctx.beginPath(); ctx.moveTo(ox+a.position[0]*scale,oy+a.position[1]*scale); ctx.lineTo(ox+b.position[0]*scale,oy+b.position[1]*scale); ctx.stroke(); }); data.nodes.forEach(n=>{ const x=ox+n.position[0]*scale,y=oy+n.position[1]*scale,q=n.queue_ns+n.queue_ew; ctx.fillStyle=q>18?'#d96b39':q>9?'#f0b94b':'#0d7770'; ctx.beginPath(); ctx.arc(x,y,19,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=n.emergency_lock!==null?'#c43228':'#14211f'; ctx.lineWidth=n.emergency_lock!==null?4:2; ctx.stroke(); ctx.fillStyle='#fffdf8'; ctx.font='bold 12px ui-sans-serif'; ctx.textAlign='center'; ctx.fillText(n.id,x,y+4); }); }
function renderTable(nodes) { $('table').innerHTML='<table><thead><tr><th>Node</th><th>Green</th><th>NS queue</th><th>EW queue</th></tr></thead><tbody>'+nodes.map(n=>`<tr><td>${n.id}</td><td>${n.phase===0?'NS':'EW'}</td><td>${n.queue_ns}</td><td>${n.queue_ew}</td></tr>`).join('')+'</tbody></table>'; }
async function run() { const button=$('run'); button.disabled=true; $('status').textContent='Computing...'; $('error').textContent=''; try { const response=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(options())}); const data=await response.json(); if(!response.ok) throw new Error(data.error||'Simulation failed'); $('avg').textContent=data.metrics.avg_queue_length.toFixed(1); $('throughput').textContent=data.metrics.throughput+' veh'; $('fuel').textContent=data.metrics.fuel_liters.toFixed(2)+' L'; $('co2').textContent=data.metrics.co2_kg.toFixed(2)+' kg'; renderTable(data.nodes); draw(data); $('status').textContent='Scenario complete'; } catch(error) { $('status').textContent='Error'; $('error').textContent=error.message; } finally { button.disabled=false; } }
$('run').addEventListener('click',run); run();
</script>
</body>
</html>
